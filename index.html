<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad Joke Flip Cards</title>
  <style>
    :root {
      --ink: #1a1230;
      --paper: #fff8ee;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #ffd6e8 0%, transparent 38%),
        radial-gradient(circle at 88% 8%, #c9f4ff 0%, transparent 36%),
        radial-gradient(circle at 80% 88%, #ffe08a 0%, transparent 40%),
        radial-gradient(circle at 10% 90%, #d8c7ff 0%, transparent 38%),
        linear-gradient(160deg, #fff4d6, #e8fff6 45%, #ffe9f4);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .stage {
      width: min(720px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hint {
      margin: 0 0 28px;
      font-size: 1.05rem;
      opacity: 0.8;
    }

    kbd {
      display: inline-block;
      padding: 2px 8px;
      border: 2px solid #1a1230;
      border-bottom-width: 4px;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-weight: 700;
    }

    .scene {
      perspective: 1400px;
      width: min(560px, 100%);
      height: 340px;
      margin: 0 auto 22px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transition: transform 0.28s ease;
      transform-style: preserve-3d;
    }

    .card.spin {
      transform: rotateY(90deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      display: grid;
      place-items: center;
      padding: 36px 32px;
      border: 6px solid rgba(255,255,255,0.55);
      box-shadow:
        0 18px 0 rgba(26, 18, 48, 0.12),
        0 30px 50px rgba(26, 18, 48, 0.18);
    }

    .front {
      background: linear-gradient(145deg, var(--c1), var(--c2));
    }

    .back {
      background: linear-gradient(145deg, var(--c3), var(--c4));
      display: none;
    }

    .card.show-back .front { display: none; }
    .card.show-back .back { display: grid; }

    .label {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(255,255,255,0.55);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .joke, .punch {
      font-size: clamp(1.35rem, 3.4vw, 2.05rem);
      line-height: 1.25;
      margin: 0;
      max-width: 18ch;
    }

    .punch {
      font-weight: 800;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 3px solid #1a1230;
      border-bottom-width: 6px;
      background: #fff7c2;
      color: #1a1230;
      font: inherit;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 16px;
      cursor: pointer;
    }

    button:active {
      border-bottom-width: 3px;
      transform: translateY(3px);
    }

    #next {
      background: #b8ffd4;
    }

    .counter {
      margin-top: 16px;
      font-weight: 700;
      opacity: 0.75;
    }

    .emoji-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 5;
    }

    .floater {
      position: absolute;
      left: var(--x);
      top: 110%;
      font-size: var(--size);
      animation: rise var(--dur) linear forwards;
      transform: rotate(var(--rot));
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(var(--rot)) scale(0.6); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateY(-130vh) rotate(calc(var(--rot) + 40deg)) scale(1.15); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Dad Joke Flip Cards</h1>
    <p class="hint">Press <kbd>Space</kbd> to flip. Press <kbd>N</kbd> for a new joke.</p>
    <div class="scene">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Joke card. Press space to flip.">
        <div class="face front">
          <span class="label">Setup</span>
          <p class="joke" id="setup"></p>
        </div>
        <div class="face back">
          <span class="label">Punchline</span>
          <p class="punch" id="punch"></p>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="flip" type="button">Flip card</button>
      <button id="next" type="button">Next joke</button>
    </div>
    <p class="counter" id="counter"></p>
  </div>
  <div class="emoji-layer" id="emojis" aria-hidden="true"></div>

  <script>
    const JOKES = [
      { setup: "funny dad jokes", punch: "Press Next for the first groaner.", title: true },
      { setup: "Why don't scientists trust atoms?", punch: "Because they make up everything." },
      { setup: "I told my wife she was drawing her eyebrows too high.", punch: "She looked surprised." },
      { setup: "Why did the scarecrow win an award?", punch: "He was outstanding in his field." },
      { setup: "What do you call a fake noodle?", punch: "An impasta." },
      { setup: "I used to hate facial hair...", punch: "but then it grew on me." },
      { setup: "Why can't you hear a pterodactyl go to the bathroom?", punch: "Because the P is silent." },
      { setup: "What's brown and sticky?", punch: "A stick." },
      { setup: "Why did the bicycle fall over?", punch: "It was two-tired." },
      { setup: "How does a penguin build its house?", punch: "Igloos it together." },
      { setup: "Why did the golfer bring two pairs of pants?", punch: "In case he got a hole in one." },
      { setup: "I would tell you a construction joke...", punch: "but I'm still working on it." },
      { setup: "What do you call cheese that isn't yours?", punch: "Nacho cheese." },
      { setup: "Why don't eggs tell jokes?", punch: "They'd crack each other up." },
      { setup: "What do you call a belt made of watches?", punch: "A waist of time." },
      { setup: "Why did the math book look so sad?", punch: "It had too many problems." },
      { setup: "What's orange and sounds like a parrot?", punch: "A carrot." },
      { setup: "I only know 25 letters of the alphabet.", punch: "I don't know Y." },
      { setup: "Did you hear about the restaurant on the moon?", punch: "Great food, no atmosphere." },
      { setup: "Why did the coffee file a police report?", punch: "It got mugged." },
      { setup: "What do you call a sleeping bull?", punch: "A bulldozer." },
      { setup: "How do you organize a space party?", punch: "You planet." },
      { setup: "Why can't your nose be 12 inches long?", punch: "Because then it would be a foot." },
      { setup: "What did the ocean say to the beach?", punch: "Nothing, it just waved." },
      { setup: "Why did the cookie go to the doctor?", punch: "It felt crummy." }
    ];

    const PALETTES = [
      { c1: "#ff8fab", c2: "#ffc2d4", c3: "#7bdff2", c4: "#b2f7ef" },
      { c1: "#ffd166", c2: "#ff9f1c", c3: "#06d6a0", c4: "#118ab2" },
      { c1: "#c77dff", c2: "#9b5de5", c3: "#fee440", c4: "#00bbf9" },
      { c1: "#80ed99", c2: "#57cc99", c3: "#ff6b6b", c4: "#ffd93d" },
      { c1: "#48cae4", c2: "#023e8a", c3: "#f72585", c4: "#b5179e" },
      { c1: "#f4a261", c2: "#e76f51", c3: "#2a9d8f", c4: "#e9c46a" }
    ];

    const LAUGHS = ["😂", "🤣", "😆", "😹", "😄", "😜", "🥳"];

    const card = document.getElementById("card");
    const setupEl = document.getElementById("setup");
    const punchEl = document.getElementById("punch");
    const counterEl = document.getElementById("counter");
    const emojiLayer = document.getElementById("emojis");

    let index = 0;
    let flipped = false;
    let busy = false;

    function paintCard(i) {
      const pal = PALETTES[i % PALETTES.length];
      const joke = JOKES[i];
      const realCount = JOKES.filter((j) => !j.title).length;
      card.style.setProperty("--c1", pal.c1);
      card.style.setProperty("--c2", pal.c2);
      card.style.setProperty("--c3", pal.c3);
      card.style.setProperty("--c4", pal.c4);
      setupEl.textContent = joke.setup;
      punchEl.textContent = joke.punch;
      document.querySelector(".front .label").textContent = joke.title ? "Welcome" : "Setup";
      document.querySelector(".back .label").textContent = joke.title ? "Let's go" : "Punchline";
      counterEl.textContent = joke.title
        ? "Get ready"
        : `Joke ${i} of ${realCount}`;
    }

    function floodLaughs() {
      const count = 42;
      for (let i = 0; i < count; i++) {
        const span = document.createElement("span");
        span.className = "floater";
        span.textContent = LAUGHS[Math.floor(Math.random() * LAUGHS.length)];
        span.style.setProperty("--x", Math.random() * 100 + "vw");
        span.style.setProperty("--size", 28 + Math.random() * 42 + "px");
        span.style.setProperty("--dur", 1.6 + Math.random() * 1.8 + "s");
        span.style.setProperty("--rot", (Math.random() * 50 - 25) + "deg");
        span.style.animationDelay = Math.random() * 0.35 + "s";
        emojiLayer.appendChild(span);
        span.addEventListener("animationend", () => span.remove());
      }
    }

    function flipCard() {
      if (busy) return;
      busy = true;
      card.classList.add("spin");
      setTimeout(() => {
        flipped = !flipped;
        card.classList.toggle("show-back", flipped);
        card.classList.remove("spin");
        if (flipped) floodLaughs();
        busy = false;
      }, 280);
    }

    function nextJoke() {
      if (busy) return;
      flipped = false;
      card.classList.remove("show-back", "spin");
      index = (index + 1) % JOKES.length;
      if (index === 0 && JOKES.length > 1) index = 1;
      paintCard(index);
    }

    document.getElementById("flip").addEventListener("click", flipCard);
    document.getElementById("next").addEventListener("click", nextJoke);
    card.addEventListener("click", flipCard);

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      }
      if (e.key === "n" || e.key === "N") nextJoke();
    });

    paintCard(0);
  </script>
</body>
</html>
